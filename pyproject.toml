[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insur-spec"
version = "0.1.0"
description = "Sovereign Spec-Driven Coding Agent with Immutable Constitutional Governance, Skills Factory, and Backstage.io Integration"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Kris Jones", email = "kris@bluebridgepeople.com" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0.0",
]
bedrock = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "google-genai>=1.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
insur-spec = "insur_spec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/insur_spec"]
