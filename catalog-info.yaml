apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: insurspec
  title: InsurSpec
  description: Sovereign spec-driven coding agent CLI with constitutional governance, 26-skill factory, MCP server, and Backstage.io integration.
  annotations:
    github.com/project-slug: K-J-Web-Designs/InsurSpec
    backstage.io/techdocs-ref: dir:.
  tags:
    - ai-agent
    - cli
    - cybertron
    - python
    - typer
    - gemini
    - docker
  links:
    - url: https://github.com/K-J-Web-Designs/InsurSpec
      title: GitHub Repository
      icon: github
spec:
  type: ai-agent
  lifecycle: experimental
  owner: user:default/kris
  system: ai-ventures
  providesApis:
    - insurspec-mcp-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: insurspec-mcp-api
  title: InsurSpec MCP Server
  description: Model Context Protocol (MCP) server interface for InsurSpec skills factory and constitutional governance.
spec:
  type: mcp
  lifecycle: experimental
  owner: user:default/kris
  system: ai-ventures
  definition: |
    protocol: Model Context Protocol (MCP)
    transport: stdio / sse
    capabilities:
      - Constitutional Governance
      - 26-Skill Insurance Factory
      - Backstage.io Integration
